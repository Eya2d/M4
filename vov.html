<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نسخ الأرقام</title>
<style>
    body {
        font-family: Arial, sans-serif;
        padding: 30px;
        text-align: center;
    }
    .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin-bottom: 20px;
    }
    .field {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
    }
    label {
        font-size: 14px;
        margin-bottom: 5px;
        color: #333;
    }
    input[type="number"] {
        padding: 10px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 150px;
        text-align: center;
    }
    button {
        padding: 12px 25px;
        font-size: 18px;
        cursor: pointer;
        border: 0;
        border-radius: 8px;
        background-color: #2563eb;
        color: #fff;
    }
    button:disabled {
        background-color: #93c5fd;
        cursor: not-allowed;
    }
    button:hover:not(:disabled) {
        background-color: #1d4ed8;
    }
    #status {
        margin-top: 15px;
        font-weight: bold;
    }
    #progressWrap {
        margin-top: 15px;
        width: 100%;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
        background: #e5e7eb;
        border-radius: 8px;
        overflow: hidden;
        height: 10px;
        display: none;
    }
    #progressBar {
        height: 100%;
        width: 0%;
        background-color: #2563eb;
        transition: width 0.05s linear;
    }
</style>
</head>
<body>
<div class="controls">
    <div class="field">
        <label for="startNumber">يبدأ من</label>
        <input type="number" id="startNumber" value="270">
    </div>
    <div class="field">
        <label for="countNumber">عدد الأرقام</label>
        <input type="number" id="countNumber" value="300000" min="1">
    </div>
</div>
<button id="copyNumbers">نسخ الأرقام</button>
<div id="status"></div>
<div id="progressWrap"><div id="progressBar"></div></div>
<script>
const BATCH_COUNT = 40;
const BATCH_DELAY_MS = 1;

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// تجهيز الأرقام على دفعات في الخلفية لتفادي تجميد المتصفح
async function buildNumbersInBatches(start, count, onProgress) {
    const numbers = new Array(count);

    // تقسيم العدد الكلي على 40 دفعة (آخر دفعة تأخذ الباقي)
    const batchSize = Math.ceil(count / BATCH_COUNT);

    let index = 0;

    for (let batch = 0; batch < BATCH_COUNT && index < count; batch++) {
        const end = Math.min(index + batchSize, count);

        for (; index < end; index++) {
            numbers[index] = String(start + index);
        }

        if (onProgress) {
            onProgress(index, count);
        }

        // مهلة صغيرة بين كل دفعة والأخرى حتى لا تتجمد الصفحة
        if (index < count) {
            await sleep(BATCH_DELAY_MS);
        }
    }

    return numbers;
}

document.getElementById("copyNumbers").addEventListener("click", async () => {
    const button = document.getElementById("copyNumbers");
    const statusEl = document.getElementById("status");
    const progressWrap = document.getElementById("progressWrap");
    const progressBar = document.getElementById("progressBar");

    const start = parseInt(document.getElementById("startNumber").value, 10);
    const count = parseInt(document.getElementById("countNumber").value, 10);

    if (isNaN(start) || isNaN(count) || count <= 0) {
        statusEl.textContent = "الرجاء إدخال قيم صحيحة.";
        return;
    }

    button.disabled = true;
    statusEl.textContent = "جارٍ التحضير...";
    progressWrap.style.display = "block";
    progressBar.style.width = "0%";

    // مهلة صغيرة حتى تظهر الرسالة قبل بدء العمل
    await sleep(0);

    const numbers = await buildNumbersInBatches(start, count, (done, total) => {
        const percent = Math.round((done / total) * 100);
        progressBar.style.width = percent + "%";
        statusEl.textContent = `جارٍ التحضير... ${percent}%`;
    });

    const text = numbers.join("\n");

    try {
        await navigator.clipboard.writeText(text);
        statusEl.textContent =
            `تم نسخ ${count.toLocaleString("ar-EG")} رقم بنجاح.`;
    } catch (error) {
        // طريقة بديلة إذا لم تعمل Clipboard API
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        textarea.remove();
        statusEl.textContent =
            `تم نسخ ${count.toLocaleString("ar-EG")} رقم بنجاح.`;
    }

    progressWrap.style.display = "none";
    button.disabled = false;
});
</script>
</body>
</html>
