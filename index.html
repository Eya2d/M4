<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحميل كميات كبيرة من الصور</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #1a1a2e;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  .controls {
    background: #16213e;
    padding: 20px;
    border-radius: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    position: sticky;
    top: 10px;
    z-index: 100;
  }
  label { font-weight: bold; }
  input[type="number"] {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #444;
    background: #0f3460;
    color: #fff;
    width: 120px;
    font-size: 15px;
  }
  button {
    padding: 10px 22px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, #e94560, #f77f00);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 15px;
    transition: transform 0.2s, opacity 0.2s;
  }
  button:hover:not(:disabled) { transform: scale(1.05); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #stopBtn { background: linear-gradient(135deg, #555, #333); }
  #clearBtn { background: linear-gradient(135deg, #0f3460, #533483); }

  .stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 15px;
    font-size: 15px;
  }
  .stats span { background: #16213e; padding: 8px 14px; border-radius: 8px; }
  .progress-bar {
    width: 100%;
    height: 10px;
    background: #16213e;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #e94560, #f77f00);
    transition: width 0.2s;
  }

  #gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .img-card {
    position: relative;
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    background: #16213e;
    animation: fadeIn 0.4s ease;
  }
  .img-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s;
  }
  .img-card:hover img { transform: scale(1.1); }
  .img-card .idx {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="controls">
  <label for="count">عدد الصور:</label>
  <input type="number" id="count" value="500" min="1" max="100000">

  <label for="batchSize">حجم الدفعة:</label>
  <input type="number" id="batchSize" value="50" min="1" max="500">

  <label for="delay">التأخير (ملي ثانية):</label>
  <input type="number" id="delay" value="50" min="0" max="5000">

  <button id="startBtn">إنشاء</button>
  <button id="stopBtn" disabled>إيقاف</button>
  <button id="clearBtn">مسح</button>
</div>

<div class="stats">
  <span>المطلوب: <b id="statTotal">0</b></span>
  <span>تم التحميل: <b id="statLoaded">0</b></span>
  <span>الحالة: <b id="statStatus">جاهز</b></span>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div id="gallery"></div>

<script>
  const gallery    = document.getElementById('gallery');
  const countInput = document.getElementById('count');
  const batchInput = document.getElementById('batchSize');
  const delayInput = document.getElementById('delay');
  const startBtn   = document.getElementById('startBtn');
  const stopBtn    = document.getElementById('stopBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const statTotal  = document.getElementById('statTotal');
  const statLoaded = document.getElementById('statLoaded');
  const statStatus = document.getElementById('statStatus');
  const progressFill = document.getElementById('progressFill');

  let stopped = false;
  let running = false;

  // مصدر صور عشوائي - picsum.photos يعطي صورة مختلفة لكل seed
  function getImageUrl(index) {
    // نضيف seed عشوائي + رقم لضمان تنوع الصور
    const seed = Math.floor(Math.random() * 1000000) + index;
    return `https://picsum.photos/seed/${seed}/400/400`;
  }

  function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function loadImages(total, batchSize, delay) {
    running = true;
    stopped = false;
    startBtn.disabled = true;
    stopBtn.disabled = false;
    gallery.innerHTML = '';
    statTotal.textContent = total;
    statLoaded.textContent = '0';
    statStatus.textContent = 'جارٍ التحميل...';
    progressFill.style.width = '0%';

    let loaded = 0;

    for (let i = 0; i < total; i += batchSize) {
      if (stopped) break;

      const end = Math.min(i + batchSize, total);
      const fragment = document.createDocumentFragment();

      for (let j = i; j < end; j++) {
        const card = document.createElement('div');
        card.className = 'img-card';

        const img = document.createElement('img');
        img.loading = 'lazy';
        img.src = getImageUrl(j);
        img.alt = `صورة ${j + 1}`;
        img.onerror = () => {
          // في حال فشل التحميل نستبدلها بصورة بديلة
          img.src = `https://picsum.photos/seed/fallback${j}/400/400`;
        };

        const idx = document.createElement('span');
        idx.className = 'idx';
        idx.textContent = j + 1;

        card.appendChild(img);
        card.appendChild(idx);
        fragment.appendChild(card);
      }

      gallery.appendChild(fragment);
      loaded = end;
      statLoaded.textContent = loaded;
      progressFill.style.width = ((loaded / total) * 100).toFixed(2) + '%';

      // ننتظر فقط بين الدفعات وليس بعد الأخيرة
      if (end < total && !stopped) {
        await sleep(delay);
      }
    }

    if (stopped) {
      statStatus.textContent = `تم الإيقاف عند ${loaded}`;
    } else {
      statStatus.textContent = 'اكتمل ✅';
      progressFill.style.width = '100%';
    }

    running = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
  }

  startBtn.addEventListener('click', () => {
    if (running) return;
    const total = Math.max(1, parseInt(countInput.value) || 1);
    const batch = Math.max(1, parseInt(batchInput.value) || 50);
    const delay = Math.max(0, parseInt(delayInput.value) || 0);
    loadImages(total, batch, delay);
  });

  stopBtn.addEventListener('click', () => {
    stopped = true;
    statStatus.textContent = 'جارٍ الإيقاف...';
  });

  clearBtn.addEventListener('click', () => {
    if (running) return;
    gallery.innerHTML = '';
    statLoaded.textContent = '0';
    statTotal.textContent = '0';
    statStatus.textContent = 'جاهز';
    progressFill.style.width = '0%';
  });
</script>

</body>
</html>
