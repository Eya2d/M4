<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة فيديوهات يوتيوب</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;600;700&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #FAF9F5;
    --surface: #FFFFFF;
    --surface-2: #F0EEE6;
    --text: #141413;
    --muted: #5E5D59;
    --border: #E8E6DC;
    --accent: #D97757;
    --accent-strong: #C6613F;
    --accent-soft: #F6E6DE;
    --danger: #B3402A;
    --radius: 12px;
    --serif: 'Noto Naskh Arabic', 'Amiri', Georgia, serif;
    --sans: 'Noto Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --surface: #30302E;
      --surface-2: #3A3A37;
      --text: #FAF9F5;
      --muted: #B8B6AC;
      --border: #44443F;
      --accent-soft: #4A3128;
      --danger: #F08A72;
    }
  }

  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.7;
    min-height: 100vh;
  }

  .page { max-width: 1040px; margin: 0 auto; padding: 56px 24px 80px; }

  /* Header */
  .brand {
    display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
  }
  .brand-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center; font-size: 26px;
  }
  .brand span { font-weight: 600; font-size: 15px; color: var(--muted); }

  h1 {
    font-family: var(--serif);
    font-size: 40px; line-height: 1.35; font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 12px;
  }
  .lead { font-size: 18px; color: var(--muted); max-width: 60ch; margin-bottom: 36px; }

  /* Input card */
  .composer {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 48px;
    box-shadow: 0 1px 2px rgba(20, 20, 19, 0.04);
  }
  .composer label {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
  }
  .composer label ion-icon { font-size: 20px; color: var(--accent-strong); }

  textarea {
    width: 100%; min-height: 128px; resize: vertical;
    padding: 14px 16px;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    font-family: ui-monospace, 'SF Mono', Consolas, monospace;
    font-size: 14px; line-height: 1.6;
    direction: ltr; text-align: left;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea::placeholder { color: var(--muted); opacity: .7; }
  textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .actions {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin-top: 16px;
  }
  .hint { font-size: 13px; color: var(--muted); margin-inline-start: auto; }
  kbd {
    font-family: var(--sans); font-size: 12px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 6px; padding: 1px 6px;
  }

  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--sans); font-size: 15px; font-weight: 600;
    padding: 10px 20px; border-radius: 10px;
    border: 1px solid transparent; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  .btn ion-icon { font-size: 20px; }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }

  .btn-primary { background: var(--accent-strong); color: #fff; }
  .btn-primary:hover { background: #B5553A; }
  .btn-ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
  .btn-sm ion-icon { font-size: 17px; }

  .error {
    display: none; align-items: center; gap: 8px;
    margin-top: 14px; padding: 10px 14px;
    background: var(--accent-soft); color: var(--danger);
    border-radius: 10px; font-size: 14px; font-weight: 500;
  }
  .error.show { display: flex; }
  .error ion-icon { font-size: 20px; flex-shrink: 0; }

  /* Library */
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px;
  }
  h2 {
    font-family: var(--serif);
    font-size: 26px; font-weight: 600; line-height: 1.4;
    display: flex; align-items: center; gap: 10px;
  }
  .count {
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    background: var(--accent-soft); color: var(--accent-strong);
    padding: 2px 10px; border-radius: 999px;
  }

  .grid {
    display: grid; gap: 20px;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr));
  }
  .grid:empty { display: none; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; overflow: hidden;
    animation: pop .25s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }

  .frame { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 12px 16px;
  }
  .card-foot .id {
    display: flex; align-items: center; gap: 6px;
    font-size: 13px; color: var(--muted); direction: ltr;
  }
  .card-foot .id ion-icon { font-size: 18px; color: var(--accent-strong); }
  .btn-danger:hover { color: var(--danger); border-color: var(--danger); }

  /* Empty state */
  .empty {
    display: none; flex-direction: column; align-items: center; text-align: center;
    padding: 56px 24px; gap: 8px;
    background: var(--surface); border: 1px dashed var(--border); border-radius: 16px;
  }
  .empty.show { display: flex; }
  .empty ion-icon { font-size: 40px; color: var(--accent); }
  .empty strong { font-size: 18px; font-weight: 600; }
  .empty p { color: var(--muted); font-size: 15px; max-width: 42ch; }

  @media (max-width: 600px) {
    .page { padding: 32px 16px 56px; }
    h1 { font-size: 30px; }
    .lead { font-size: 16px; }
    .hint { display: none; }
    .btn-primary { flex: 1; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }
</style>
</head>
<body>

<main class="page">
  <div class="brand">
    <div class="brand-icon"><ion-icon name="logo-youtube"></ion-icon></div>
    <span>مكتبة الفيديو</span>
  </div>

  <h1>أضف فيديوهات يوتيوب إلى صفحتك</h1>
  <p class="lead">الصق كود التضمين أو رابط الفيديو، وسيظهر مباشرة بحجم متجاوب يناسب كل الشاشات.</p>

  <section class="composer" aria-label="إضافة فيديو">
    <label for="iframeInput">
      <ion-icon name="code-slash-outline"></ion-icon>
      كود iframe أو رابط الفيديو
    </label>
    <textarea id="iframeInput" spellcheck="false"
      placeholder='<iframe src="https://www.youtube.com/embed/..."></iframe>'></textarea>

    <div class="actions">
      <button class="btn btn-primary" id="addBtn" type="button">
        <ion-icon name="add-circle-outline"></ion-icon>
        إضافة الفيديو
      </button>
      <button class="btn btn-ghost" id="pasteBtn" type="button">
        <ion-icon name="clipboard-outline"></ion-icon>
        لصق من الحافظة
      </button>
      <span class="hint">أو اضغط <kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
    </div>

    <div class="error" id="errorMsg" role="alert">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span id="errorText"></span>
    </div>
  </section>

  <section aria-label="الفيديوهات المضافة">
    <div class="section-head">
      <h2>
        <ion-icon name="film-outline"></ion-icon>
        الفيديوهات
        <span class="count" id="count">0</span>
      </h2>
      <button class="btn btn-ghost btn-sm btn-danger" id="clearBtn" type="button" hidden>
        <ion-icon name="trash-bin-outline"></ion-icon>
        حذف الكل
      </button>
    </div>

    <div class="grid" id="videoContainer"></div>

    <div class="empty show" id="emptyState">
      <ion-icon name="play-circle-outline"></ion-icon>
      <strong>لا توجد فيديوهات بعد</strong>
      <p>انسخ كود التضمين من يوتيوب عبر «مشاركة ← تضمين»، ثم الصقه في الحقل بالأعلى.</p>
    </div>
  </section>
</main>

<script type="module" src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/ionicons@7.4.0/dist/ionicons/ionicons.js"></script>

<script>
  const input      = document.getElementById('iframeInput');
  const addBtn     = document.getElementById('addBtn');
  const pasteBtn   = document.getElementById('pasteBtn');
  const clearBtn   = document.getElementById('clearBtn');
  const container  = document.getElementById('videoContainer');
  const emptyState = document.getElementById('emptyState');
  const errorBox   = document.getElementById('errorMsg');
  const errorText  = document.getElementById('errorText');
  const countEl    = document.getElementById('count');

  // استخراج معرّف الفيديو من كود iframe أو من رابط يوتيوب عادي
  function extractVideoId(text) {
    if (!text) return null;
    const src = text.match(/src\s*=\s*["']([^"']+)["']/i);
    const candidate = src ? src[1] : text.trim();
    const m = candidate.match(
      /(?:youtube(?:-nocookie)?\.com\/(?:embed\/|watch\?(?:.*&)?v=|shorts\/)|youtu\.be\/)([\w-]{11})/i
    );
    return m ? m[1] : null;
  }

  function showError(msg) {
    errorText.textContent = msg;
    errorBox.classList.add('show');
  }
  function hideError() { errorBox.classList.remove('show'); }

  // تحديث العدّاد والحالة الفارغة
  function refresh() {
    const n = container.children.length;
    countEl.textContent = n;
    emptyState.classList.toggle('show', n === 0);
    clearBtn.hidden = n < 2;
  }

  function addVideo(id) {
    const card = document.createElement('article');
    card.className = 'card';

    // بناء الـ iframe بشكل آمن من المعرّف فقط
    const frame = document.createElement('div');
    frame.className = 'frame';
    const iframe = document.createElement('iframe');
    iframe.src = 'https://www.youtube.com/embed/' + id;
    iframe.title = 'مشغّل فيديو يوتيوب';
    iframe.loading = 'lazy';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    iframe.referrerPolicy = 'strict-origin-when-cross-origin';
    frame.appendChild(iframe);

    const foot = document.createElement('div');
    foot.className = 'card-foot';
    foot.innerHTML =
      '<span class="id"><ion-icon name="logo-youtube"></ion-icon></span>' +
      '<button class="btn btn-ghost btn-sm btn-danger" type="button">' +
      '<ion-icon name="trash-outline"></ion-icon>حذف</button>';
    foot.querySelector('.id').append(id);
    foot.querySelector('button').addEventListener('click', () => {
      card.remove();
      refresh();
    });

    card.append(frame, foot);
    container.prepend(card);
    refresh();
  }

  function handleAdd() {
    const id = extractVideoId(input.value);
    if (!id) {
      showError('الكود غير صالح. الصق كود iframe كاملاً أو رابط فيديو من يوتيوب.');
      input.focus();
      return;
    }
    hideError();
    addVideo(id);
    input.value = '';
    input.focus();
  }

  addBtn.addEventListener('click', handleAdd);

  input.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') handleAdd();
  });
  input.addEventListener('input', hideError);

  pasteBtn.addEventListener('click', async () => {
    try {
      input.value = await navigator.clipboard.readText();
      handleAdd();
    } catch {
      showError('تعذّر الوصول إلى الحافظة. الصق الكود يدوياً داخل الحقل.');
    }
  });

  clearBtn.addEventListener('click', () => {
    container.innerHTML = '';
    refresh();
  });

  refresh();
</script>
</body>
</html>
