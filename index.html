<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>إضافة فيديو يوتيوب</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  
  body {
    background: #0f0f0f;
    color: #fff;
    padding: 30px;
    max-width: 1000px;
    margin: auto;
  }

  h2 { color: #ff0000; }

  .input-box {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }

  textarea {
    width: 100%;
    min-height: 120px;
    padding: 12px;
    background: #1e1e1e;
    color: #fff;
    border: 1px solid #333;
    border-radius: 8px;
    font-size: 14px;
    resize: vertical;
    direction: ltr;
  }

  button {
    background: #ff0000;
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
    align-self: flex-start;
  }

  button:hover { background: #cc0000; transform: scale(1.03); }
  button:active { transform: scale(0.97); }

  /* الديف الذي يعرض الفيديو */
  #videoContainer {
    margin-top: 20px;
    width: 100%;
    min-height: 100px;
    background: #1a1a1a;
    border: 2px dashed #444;
    border-radius: 10px;
    padding: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
  }

  #videoContainer:empty::before {
    content: "🎬 لم يتم إضافة أي فيديو بعد";
    color: #888;
    font-size: 16px;
  }

  #videoContainer iframe {
    border-radius: 10px;
    max-width: 100%;
  }

  .error {
    color: #ff4d4d;
    font-size: 14px;
    margin-top: 5px;
  }
</style>
</head>
<body>

  <h2>🎥 إضافة فيديو يوتيوب</h2>

  <div class="input-box">
    <label>الصق كود iframe المنسوخ من يوتيوب هنا:</label>
    <textarea id="iframeInput" placeholder='<iframe width="933" height="525" src="https://www.youtube.com/embed/..." ...></iframe>'></textarea>
    <button id="addBtn">➕ إضافة الفيديو</button>
    <div id="errorMsg" class="error"></div>
  </div>

  <!-- الديف الذي يتم عرض الفيديو بداخله -->
  <div id="videoContainer"></div>

<script>
  const input     = document.getElementById('iframeInput');
  const addBtn    = document.getElementById('addBtn');
  const container = document.getElementById('videoContainer');
  const errorMsg  = document.getElementById('errorMsg');

  // دالة لتنظيف كود iframe والتحقق منه
  function extractIframe(code) {
    if (!code) return null;

    // استخراج وسم iframe فقط
    const match = code.match(/<iframe[\s\S]*?<\/iframe>/i);
    if (!match) return null;

    let iframeCode = match[0];

    // التحقق من أنه رابط يوتيوب
    if (!/youtube\.com\/embed\//i.test(iframeCode)) return null;

    // إجبار الفيديو على أن يكون متجاوباً
    iframeCode = iframeCode
      .replace(/width="[^"]*"/i, 'width="100%"')
      .replace(/height="[^"]*"/i, 'height="500"');

    return iframeCode;
  }

  addBtn.addEventListener('click', () => {
    const raw = input.value.trim();
    const clean = extractIframe(raw);

    if (!clean) {
      errorMsg.textContent = '⚠️ الرجاء لصق كود iframe صحيح من يوتيوب';
      return;
    }

    errorMsg.textContent = '';

    // إنشاء عنصر لعرض الفيديو وزر حذفه
    const wrapper = document.createElement('div');
    wrapper.style.position = 'relative';
    wrapper.style.width = '100%';

    // إزالة أي iframe سابق (اختياري - احذف السطر التالي لو تريد إضافة أكثر من فيديو)
    container.innerHTML = '';

    wrapper.innerHTML = clean;

    // زر حذف الفيديو
    const delBtn = document.createElement('button');
    delBtn.textContent = '🗑️ حذف';
    delBtn.style.cssText = 'margin-top:10px; background:#333; padding:8px 16px; font-size:13px;';
    delBtn.onclick = () => wrapper.remove();

    wrapper.appendChild(delBtn);
    container.appendChild(wrapper);

    // تفريغ الحقل بعد الإضافة
    input.value = '';
  });

  // إضافة بالفيديو عند الضغط على Ctrl + Enter داخل الحقل
  input.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Enter') addBtn.click();
  });
</script>

</body>
</html>
