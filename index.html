<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عالم الأنمي والكرتون - Anime & Cartoon World</title>

    <style>
        /* ================================
           CSS RESET & STYLES
        ================================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            outline: none;
            width: 250px;
            background-color: #334155;
            color: white;
        }

        .search-box button {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: none;
            background-color: #0284c7;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background-color: #0369a1;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .section-title {
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            border-right: 4px solid #38bdf8;
            padding-right: 10px;
        }

        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background: #334155;
        }

        .card-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-rating {
            font-size: 0.85rem;
            color: #fbbf24;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-content {
            background-color: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            max-width: 900px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 8px;
            left: 15px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            line-height: 1;
            z-index: 10;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-top: 1rem;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-container iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ================================
           SERVERS SECTION
        ================================= */
        .servers-section {
            margin-top: 12px;
            background: #0f172a;
            padding: 10px 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .servers-title {
            font-size: 0.9rem;
            color: #38bdf8;
            font-weight: bold;
        }

        .server-btn {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .server-btn:hover {
            background: #475569;
        }

        .server-btn.active {
            background: #0284c7;
            border-color: #38bdf8;
            font-weight: bold;
        }

        .player-status {
            margin-top: 10px;
            padding: 10px 15px;
            background: #0f172a;
            border-radius: 8px;
            color: #cbd5e1;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .trailer-section {
            margin-top: 1rem;
        }

        .trailer-btn {
            background: #dc2626;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .trailer-btn:hover {
            background: #b91c1c;
        }

        .episodes-section {
            margin-top: 1.5rem;
        }

        .episodes-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .episodes-title {
            font-size: 1.2rem;
            color: #38bdf8;
        }

        .episodes-count {
            background: #0284c7;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding: 10px;
            background: #0f172a;
            border-radius: 8px;
        }

        .ep-btn {
            background-color: #334155;
            color: white;
            border: 2px solid transparent;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: right;
            transition: 0.2s;
        }

        .ep-btn:hover {
            background-color: #475569;
        }

        .ep-btn.active {
            background-color: #0284c7;
            border-color: #7dd3fc;
        }

        .ep-number {
            display: block;
            font-weight: bold;
        }

        .ep-name {
            display: block;
            font-size: 0.75rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loader {
            text-align: center;
            font-size: 1.1rem;
            grid-column: 1 / -1;
            padding: 2rem;
            color: #38bdf8;
        }

        .load-more-container {
            text-align: center;
            margin: 2rem 0;
        }

        .load-more-btn {
            padding: 0.8rem 2rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .load-more-btn:hover {
            background-color: #0369a1;
        }

        .info-message {
            color: #aaa;
            padding: 15px;
            line-height: 1.7;
            text-align: center;
            grid-column: 1 / -1;
        }

        @media (max-width: 600px) {
            header { padding: 1rem; flex-direction: column; }
            .search-box { width: 100%; }
            .search-box input { width: 100%; }
            .anime-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
            .episodes-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">أنمي وكرتون HD</div>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن أنمي أو كرتون...">
        <button onclick="searchAnime()">بحث</button>
    </div>
</header>

<div class="container">
    <h2 class="section-title" id="pageTitle">أحدث الأنميات والكرتون</h2>
    <div class="anime-grid" id="animeGrid"></div>
    <div class="load-more-container" id="loadMoreContainer" style="display: none;">
        <button class="load-more-btn" id="loadMoreBtn" onclick="fetchNextPage()">تحميل المزيد</button>
    </div>
</div>

<div class="modal" id="videoModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()" title="إغلاق">&times;</span>
        <h3 id="modalTitle">اسم العرض</h3>

        <!-- مشغل الفيديو -->
        <div class="video-container">
            <iframe id="videoPlayer" src="" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        </div>

        <!-- قائمة السيرفرات -->
        <div class="servers-section" id="serversSection" style="display: none;">
            <span class="servers-title">السيرفرات:</span>
            <div id="serversList" style="display: flex; gap: 8px; flex-wrap: wrap;"></div>
        </div>

        <div class="player-status" id="playerStatus">اختر العرض الترويجي أو إحدى الحلقات.</div>
        <p id="modalSynopsis" style="margin-top: 10px; font-size: 0.85rem; color: #ccc; max-height: 80px; overflow-y: auto; line-height: 1.6;"></p>

        <div class="trailer-section">
            <button class="trailer-btn" id="trailerBtn" onclick="playTrailer()">▶ تشغيل العرض الترويجي</button>
        </div>

        <div class="episodes-section">
            <div class="episodes-header">
                <h4 class="episodes-title">قائمة الحلقات (جميع الحلقات)</h4>
                <span class="episodes-count" id="episodesCount">جاري التحميل...</span>
            </div>
            <div class="episodes-grid" id="episodesGrid">
                <div class="info-message">جاري تحميل الحلقات...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const animeGrid = document.getElementById('animeGrid');
    const searchInput = document.getElementById('searchInput');
    const videoModal = document.getElementById('videoModal');
    const videoPlayer = document.getElementById('videoPlayer');
    const modalTitle = document.getElementById('modalTitle');
    const modalSynopsis = document.getElementById('modalSynopsis');
    const episodesGrid = document.getElementById('episodesGrid');
    const episodesCount = document.getElementById('episodesCount');
    const loadMoreContainer = document.getElementById('loadMoreContainer');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const playerStatus = document.getElementById('playerStatus');
    const trailerBtn = document.getElementById('trailerBtn');
    const serversSection = document.getElementById('serversSection');
    const serversList = document.getElementById('serversList');

    let currentPage = 1;
    let isSearching = false;
    let isLoadingPage = false;
    let currentAnime = null;
    let currentTrailerUrl = '';
    let currentEpisodes = [];
    let activeEpisodeNum = null;
    let activeServerIndex = 0;

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    async function apiFetch(url, maxRetries = 3) {
        let attempt = 0;
        while (attempt < maxRetries) {
            try {
                const response = await fetch(url);
                if (response.status === 429) {
                    await delay(1500 * (attempt + 1));
                    attempt++;
                    continue;
                }
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                return await response.json();
            } catch (error) {
                attempt++;
                if (attempt >= maxRetries) throw error;
                await delay(1000);
            }
        }
    }

    async function fetchNextPage() {
        if (isSearching || isLoadingPage) return;
        isLoadingPage = true;
        loadMoreBtn.disabled = true;

        try {
            const data = await apiFetch(`https://api.jikan.moe/v4/top/anime?page=${currentPage}&limit=24`);
            if (data.data && data.data.length > 0) {
                appendAnimeCards(data.data);
                currentPage++;
                loadMoreContainer.style.display = 'block';
            }
        } catch (error) {
            console.error('Fetch Error:', error);
        } finally {
            isLoadingPage = false;
            loadMoreBtn.disabled = false;
        }
    }

    function appendAnimeCards(animeList) {
        animeList.forEach(anime => {
            if (!anime) return;
            const card = document.createElement('div');
            card.className = 'card';
            const score = anime.score ? `⭐ ${anime.score}` : 'غير مقيم';
            const imageUrl = anime.images?.jpg?.large_image_url || anime.images?.jpg?.image_url || '';
            const title = anime.title_japanese || anime.title || 'عنوان غير معروف';

            card.innerHTML = `
                <img src="${imageUrl}" alt="${escapeHTML(title)}" loading="lazy">
                <div class="card-info">
                    <div class="card-title" title="${escapeHTML(title)}">${escapeHTML(title)}</div>
                    <div class="card-rating">${score}</div>
                </div>
            `;
            card.addEventListener('click', () => openModal(anime));
            animeGrid.appendChild(card);
        });
    }

    function escapeHTML(value) {
        const div = document.createElement('div');
        div.textContent = value || '';
        return div.innerHTML;
    }

    /* ================================
       FETCH ALL EPISODES (PAGINATION)
    ================================= */
    async function fetchAllEpisodes(animeId) {
        currentEpisodes = [];
        episodesGrid.innerHTML = `<div class="info-message">جاري جلب كافة الحلقات...</div>`;
        episodesCount.innerText = 'جاري التحميل...';

        try {
            let page = 1;
            let hasNextPage = true;

            // الحلقة التكرارية لجلب كافة الصفحات والحصول على كل الحلقات
            while (hasNextPage && page <= 15) { // حد أقصى 15 صفحة (أكثر من 1500 حلقة)
                const data = await apiFetch(`https://api.jikan.moe/v4/anime/${animeId}/episodes?page=${page}`);
                if (data.data && data.data.length > 0) {
                    currentEpisodes = currentEpisodes.concat(data.data);
                    hasNextPage = data.pagination.has_next_page;
                    page++;
                } else {
                    hasNextPage = false;
                }
            }

            episodesGrid.innerHTML = '';

            if (currentEpisodes.length > 0) {
                episodesCount.innerText = `${currentEpisodes.length} حلقة متاحة`;
                currentEpisodes.forEach(ep => createEpisodeButton(ep));
            } else {
                // إذا لم ترجع API حلقات، ننشئ قائمة تلقائية استناداً لعدد الحلقات المسجل للأنمي
                const totalEps = currentAnime.episodes || 12;
                episodesCount.innerText = `${totalEps} حلقة (تلقائي)`;
                for (let i = 1; i <= totalEps; i++) {
                    createEpisodeButton({ mal_id: i, title: `الحلقة ${i}` });
                }
            }
        } catch (error) {
            console.error('Episodes Fetch Error:', error);
            episodesCount.innerText = 'قائمة افتراضية';
            const totalEps = currentAnime?.episodes || 12;
            episodesGrid.innerHTML = '';
            for (let i = 1; i <= totalEps; i++) {
                createEpisodeButton({ mal_id: i, title: `الحلقة ${i}` });
            }
        }
    }

    function createEpisodeButton(episode) {
        const epBtn = document.createElement('button');
        epBtn.type = 'button';
        epBtn.className = 'ep-btn';
        const epNum = episode.mal_id || episode.number || '?';
        const epTitle = episode.title || `الحلقة ${epNum}`;

        epBtn.innerHTML = `
            <span class="ep-number">الحلقة ${epNum}</span>
            <span class="ep-name" title="${escapeHTML(epTitle)}">${escapeHTML(epTitle)}</span>
        `;
        epBtn.addEventListener('click', () => selectEpisode(epNum, epBtn));
        episodesGrid.appendChild(epBtn);
    }

    /* ================================
       SERVERS & REAL PLAYBACK LOGIC
    ================================= */
    function getEmbedServers(malId, epNum) {
        // مجموعات مختلفة من سيرفرات البث العالمية السريعة والمجانية
        return [
            { name: "سيرفر 1 (Vidsrc Fast)", url: `https://vidsrc.to/embed/anime/${malId}/${epNum}` },
            { name: "سيرفر 2 (Vidstack HD)", url: `https://vidsrc.me/embed/anime?id=${malId}&ep=${epNum}` },
            { name: "سيرفر 3 (SuperEmbed)", url: `https://multiembed.mov/directstream.php?video_id=${malId}&is_anime=1&s=1&e=${epNum}` },
            { name: "سيرفر 4 (2Embed Premium)", url: `https://www.2embed.cc/embedanime/${malId}/${epNum}` }
        ];
    }

    function renderServerButtons(malId, epNum) {
        serversList.innerHTML = '';
        const servers = getEmbedServers(malId, epNum);

        servers.forEach((server, index) => {
            const btn = document.createElement('button');
            btn.className = `server-btn ${index === activeServerIndex ? 'active' : ''}`;
            btn.innerText = server.name;
            btn.onclick = () => {
                activeServerIndex = index;
                document.querySelectorAll('.server-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                videoPlayer.src = server.url;
                playerStatus.innerHTML = `<strong>تم التبديل إلى:</strong> ${server.name} (الحلقة ${epNum})`;
            };
            serversList.appendChild(btn);
        });

        serversSection.style.display = 'flex';
        // تشغيل السيرفر الأول تلقائياً عند تغيير الحلقة
        videoPlayer.src = servers[activeServerIndex].url;
    }

    function selectEpisode(epNum, selectedButton) {
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
        if (selectedButton) selectedButton.classList.add('active');

        activeEpisodeNum = epNum;
        renderServerButtons(currentAnime.mal_id, epNum);

        playerStatus.innerHTML = `<strong>جاري تشغيل الحلقة ${epNum}</strong><br>إذا لم يعمل السيرفر الحالي، جرب التبديل بين السيرفرات أعلاه.`;
    }

    function playTrailer() {
        serversSection.style.display = 'none';
        if (!currentTrailerUrl) {
            videoPlayer.src = '';
            playerStatus.innerHTML = 'لا يوجد عرض ترويجي متاح لهذا العرض.';
            return;
        }
        videoPlayer.src = currentTrailerUrl;
        playerStatus.innerHTML = '<strong>يتم الآن تشغيل العرض الترويجي الرسمى.</strong>';
        document.querySelectorAll('.ep-btn').forEach(b => b.classList.remove('active'));
    }

    async function openModal(anime) {
        currentAnime = anime;
        currentTrailerUrl = anime.trailer?.embed_url || '';
        activeServerIndex = 0;

        const title = anime.title_japanese || anime.title || 'عنوان غير معروف';
        modalTitle.innerText = title;
        modalSynopsis.innerText = anime.synopsis || 'لا يوجد وصف متاح.';
        videoPlayer.src = '';
        serversSection.style.display = 'none';

        if (currentTrailerUrl) {
            trailerBtn.disabled = false;
            playTrailer(); // تشغيل التريلر كعرض أولي
        } else {
            trailerBtn.disabled = true;
            playerStatus.innerText = 'اختر حلقة للمشاهدة مباشرة.';
        }

        videoModal.style.display = 'flex';
        await fetchAllEpisodes(anime.mal_id);
    }

    async function searchAnime() {
        const query = searchInput.value.trim();
        if (!query) return;

        isSearching = true;
        loadMoreContainer.style.display = 'none';
        animeGrid.innerHTML = `<div class="loader">جاري البحث...</div>`;

        try {
            const data = await apiFetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(query)}&limit=24`);
            animeGrid.innerHTML = '';
            document.getElementById('pageTitle').innerText = `نتائج البحث عن: ${query}`;

            if (data.data && data.data.length > 0) {
                appendAnimeCards(data.data);
            } else {
                animeGrid.innerHTML = `<div class="loader">لم يتم العثور على نتائج.</div>`;
            }
        } catch (error) {
            animeGrid.innerHTML = `<div class="loader">حدث خطأ أثناء البحث. حاول مجدداً.</div>`;
        } finally {
            isSearching = false;
        }
    }

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchAnime(); });

    function closeModal() {
        videoModal.style.display = 'none';
        videoPlayer.src = '';
        currentAnime = null;
    }

    videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && videoModal.style.display === 'flex') closeModal(); });

    // البدء عند الفتح
    fetchNextPage();
</script>

</body>
</html>
